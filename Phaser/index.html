<!DOCTYPE html>
<!-- Idle game prototype. The outer page embeds a Phaser scene; the prototype currently displays animated sprites and a scrolling background. -->
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Idle</title>
        <style>
            /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
    
            html, body {
                width: 100%;
                height: 100%;
            }
    
            body {
                line-height: 1;
                font-family: Arial, sans-serif;
                background-color: #040218;
            }
    
            ol, ul {
                list-style: none;
            }
    
            img, video {
                max-width: 100%;
                height: auto;
                display: block;
            }
    
            a {
                text-decoration: none;
                color: inherit;
            }
        </style>
    </head>
    <body>
        <div id="div-game-container" style="height: 90%">
            <div id="game-container"></div>
        </div>
        <script src="./phaser.js"></script>
        <!-- Load the project entry module after its controls and view containers exist. -->
        <script type="module" src="./src/main.js"></script>
    </body>
    </html>
